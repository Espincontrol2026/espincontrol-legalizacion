//  OCR 
const API_KEY_STORAGE="espincontrol_ak";
const getApiKey=()=>localStorage.getItem(API_KEY_STORAGE)||"";
const setApiKey=(k)=>localStorage.setItem(API_KEY_STORAGE,k);

async function ocr(base64,mediaType){
  const apiKey=getApiKey();
  if(!apiKey) throw new Error("API key no configurada - usa el boton Configurar");
  const prompt='Analiza este recibo colombiano. Responde SOLO JSON sin markdown: {"establecimiento":"","nit":"","factura":"","subtotal":0,"iva":0,"total":0,"concepto_sugerido":"ALIMENTACION","fecha":""} concepto_sugerido debe ser uno de: ALIMENTACION, HOSPEDAJE, COMBUSTIBLE, PEAJES / TRANSPORTE, ALQUILER DE VEHICULO, MATERIAL, OTROS. Campos ilegibles: cadena vacia o 0.';
  const r=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:"claude-haiku-4-5",max_tokens:500,
      messages:[{role:"user",content:[
        {type:"image",source:{type:"base64",media_type:mediaType,data:base64}},
        {type:"text",text:prompt}
      ]}]})
  });
  if(!r.ok){const t=await r.text();throw new Error("HTTP "+r.status+": "+t.slice(0,80));}
  const d=await r.json();
  if(d.error) throw new Error(d.error.type+": "+d.error.message);
  const t=d.content&&d.content.find(function(b){return b.type==="text";});
  if(!t) throw new Error("Respuesta vacia del servidor");
  return JSON.parse(t.text.replace(/```json|```/g,"").trim());
}

//  Excel 
function exportarExcel(gastos,comisiones,ingeniero){
  const wb=XLSX.utils.book_new();

  // Una hoja por comision
  comisiones.forEach(com=>{
    const gg=gastos.filter(g=>g.comId===com.id&&g.ing===ingeniero);
    if(!gg.length)return;
    const d=[];
    d.push(["ESPINCONTROL S.A.S."]);
    d.push(["Instrumentaci\u00F3n, Automatizaci\u00F3n y Sistemas El\u00E9ctricos"]);
    d.push([]);d.push(["FO-AF-002 \u2014 LEGALIZACI\u00D3N DE ANTICIPO"]);d.push([]);
    d.push(["Nombre del Solicitante:",ingeniero,"","","Centro de Costos:",com.cc,"","Cliente:",com.cli]);
    d.push([]);
    const ef=gg.filter(g=>g.mp==="EFECTIVO").reduce((s,g)=>s+num(g.tc),0);
    const tj=gg.filter(g=>g.mp==="TARJETA").reduce((s,g)=>s+num(g.tc),0);
    d.push(["","","","","","Total Tarjeta:","",tj]);
    d.push(["","","","","","Total Efectivo:","",ef]);
    d.push(["","","","","","Total General:","",ef+tj]);
    d.push([]);
    d.push(["Item","Fecha","Pagado a","NIT","Factura","Concepto","Subtotal","IVA","Tarjeta","Efectivo"]);
    const fi=d.length+1;
    gg.forEach((g,i)=>{
      d.push([i+1,g.fp,g.est,g.nit,g.fac,g.con,num(g.sub),num(g.iva),
        g.mp==="TARJETA"?num(g.tc):0,g.mp==="EFECTIVO"?num(g.tc):0]);
    });
    const ff=fi+gg.length-1;
    d.push([]);
    d.push(["","","","","","TOTALES",{f:`SUM(G${fi}:G${ff})`},{f:`SUM(H${fi}:H${ff})`},{f:`SUM(I${fi}:I${ff})`},{f:`SUM(J${fi}:J${ff})`}]);
    d.push([]);d.push(["","","Elabor\u00F3:","","","","Revis\u00F3:","","","Aprob\u00F3 Contabilidad:"]);
    const ws=XLSX.utils.aoa_to_sheet(d);
    ws["!cols"]=[{wch:5},{wch:13},{wch:28},{wch:16},{wch:13},{wch:22},{wch:13},{wch:11},{wch:16},{wch:16}];
    const nombre=(com.cli+" CC"+com.cc).slice(0,28);
    XLSX.utils.book_append_sheet(wb,ws,nombre);
  });

  // Hoja resumen consolidado
  const dr=[["RESUMEN CONSOLIDADO \u2014 "+ingeniero],[],["Proyecto","CC","Gastos","Efectivo","Tarjeta","IVA","Total"]];
  comisiones.forEach(com=>{
    const gg=gastos.filter(g=>g.comId===com.id&&g.ing===ingeniero);
    if(!gg.length)return;
    dr.push([com.cli,com.cc,gg.length,
      gg.filter(g=>g.mp==="EFECTIVO").reduce((s,g)=>s+num(g.tc),0),
      gg.filter(g=>g.mp==="TARJETA").reduce((s,g)=>s+num(g.tc),0),
      gg.reduce((s,g)=>s+num(g.iva),0),
      gg.reduce((s,g)=>s+num(g.tc),0)]);
  });
  const wsr=XLSX.utils.aoa_to_sheet(dr);
  wsr["!cols"]=[{wch:24},{wch:10},{wch:8},{wch:16},{wch:16},{wch:14},{wch:16}];
  XLSX.utils.book_append_sheet(wb,wsr,"Resumen");
  XLSX.writeFile(wb,"Legalizacion_"+ingeniero.replace(/ /g,"_")+"_"+today()+".xlsx");
}

function App(){
  const [vista,setVista]=useState("ing");
  const [gastos,setGastos]=useState([]);
  const [comisiones,setComisiones]=useState([]);
  const [showCfg,setShowCfg]=useState(!getApiKey());
  const [keyInput,setKeyInput]=useState("");
  const [keySaved,setKeySaved]=useState(false);
  useEffect(()=>{setGastos(loadG());setComisiones(loadC());},[]);
  const addG=(g)=>{const n=[...gastos,{...g,id:Date.now()}];setGastos(n);saveG(n);};
  const delG=(id)=>{const n=gastos.filter(g=>g.id!==id);setGastos(n);saveG(n);};
  const editG=(g)=>{const n=gastos.map(x=>x.id===g.id?g:x);setGastos(n);saveG(n);};
  const addC=(c)=>{const n=[...comisiones,{...c,id:Date.now()}];setComisiones(n);saveC(n);};
  const delC=(id)=>{
    const n=comisiones.filter(c=>c.id!==id);
    setComisiones(n);saveC(n);
  };
  return h("div",{style:S.root},
    h("header",{style:S.header},
      h("div",{style:S.hInner},
        h("div",{style:S.brand},
          h("div",{style:S.brandIcon},"E"),
          h("div",null,
            h("div",{style:S.brandName},"ESPINCONTROL"),
            h("div",{style:S.brandSub},"Legalizaci\u00F3n de Anticipos"))),
        h("div",{style:S.tabs},
          h("button",{style:vista==="ing"?S.tabOn:S.tab,onClick:()=>setVista("ing")}," Ingeniero"),
          h("button",{style:vista==="con"?S.tabOn:S.tab,onClick:()=>setVista("con")}," Contabilidad"),
          h("button",{style:{padding:"6px 12px",borderRadius:8,border:"none",background:getApiKey()?"rgba(255,255,255,.12)":"#DC2626",color:"#fff",cursor:"pointer",fontWeight:600,fontSize:12},onClick:()=>setShowCfg(true)},"API"))),
    h("main",{style:S.main},

        ?h(VistaIng,{onAddG:addG,onEditG:editG,onAddC:addC,onDelC:delC,gastos,comisiones})
        :h(VistaCon,{gastos,comisiones,onDelG:delG,onEditG:editG})),
    showCfg&&h("div",{style:S.modalBg},
      h("div",{style:S.modal},
        h("div",{style:S.modalTitle},"Configurar API Key"),
        h("p",{style:{color:"#6B7280",fontSize:13,marginBottom:6}},"Ingresa tu API key de Anthropic (console.anthropic.com). Se guarda en este navegador."),
        getApiKey()&&h("div",{style:{background:"#D1FAE5",borderRadius:8,padding:"8px 12px",fontSize:12,color:"#065F46",marginBottom:10}},"API key activa"),
        h("input",{style:{...S.inp,marginBottom:12,fontFamily:"monospace",fontSize:12},type:"password",value:keyInput,
          onChange:function(e){setKeyInput(e.target.value);},placeholder:"sk-ant-api03-..."}),
        h("div",{style:{display:"flex",gap:10}},
          h("button",{style:{...S.btnOrange,marginTop:0,flex:1,background:keySaved?"#065F46":"#FF6B35"},
            onClick:function(){
              if(keyInput.length>10){setApiKey(keyInput);setKeySaved(true);
                setTimeout(function(){setKeySaved(false);setShowCfg(false);},1200);}
            }},keySaved?"Guardada!":"Guardar Key"),
          h("button",{style:{...S.btnOrange,marginTop:0,flex:1,background:"#F1F5F9",color:"#374151"},

//  Vista Ingeniero 
function VistaIng({onAddG,onEditG,onAddC,onDelC,gastos,comisiones}){
  const EG={ing:INGENIEROS[0],comId:"",est:"",nit:"",fac:"",con:CONCEPTOS[0],sub:"",iva:"",fp:today(),mp:"EFECTIVO"};
  const [f,setF]=useState(EG);
  const [editId,setEditId]=useState(null);
  const [ocrs,setOcrs]=useState("idle");
  const [prev,setPrev]=useState(null);
  const [ok,setOk]=useState(false);
  const [errMsg,setErrMsg]=useState("");
  const [showNuevaCom,setShowNuevaCom]=useState(false);
  const [newCom,setNewCom]=useState({cli:"",cc:""});
  const ref=useRef();
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const tc=()=>num(f.sub)+num(f.iva);

  const misComisiones=comisiones.filter(c=>c.ing===f.ing);

  const handleFoto=async(e)=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=async(ev)=>{
      const url=ev.target.result;
      setPrev(url);setOcrs("loading");setErrMsg("");
      try{
        const d=await ocr(url.split(",")[1],file.type||"image/jpeg");
        if(d.establecimiento||d.subtotal){
          setF(p=>({...p,
            est:d.establecimiento||p.est,nit:d.nit||p.nit,fac:d.factura||p.fac,
            sub:d.subtotal?String(d.subtotal):p.sub,iva:d.iva?String(d.iva):p.iva,
            con:CONCEPTOS.includes(d.concepto_sugerido)?d.concepto_sugerido:p.con,
            fp:d.fecha||p.fp}));
          setOcrs("done");
        } else { setOcrs("error");setErrMsg("Respuesta vac\u00EDa del servidor"); }
      }catch(e){setOcrs("error");setErrMsg(e.message||"Error desconocido");}
    };
    reader.readAsDataURL(file);
  };

  const guardar=()=>{
    if(!f.est||!f.sub||!f.comId)return;
    if(editId){ onEditG({...f,id:editId,tc:tc()}); setEditId(null); }
    else { onAddG({...f,tc:tc(),timestamp:new Date().toISOString()}); }
    setF(p=>({...p,est:"",nit:"",fac:"",con:CONCEPTOS[0],sub:"",iva:"",fp:today()}));
    setPrev(null);setOcrs("idle");
    setOk(true);setTimeout(()=>setOk(false),2500);
  };

  const cargarEdicion=(g)=>{
    setF({ing:g.ing,comId:g.comId||"",est:g.est,nit:g.nit,fac:g.fac,
      con:g.con,sub:String(g.sub),iva:String(g.iva),fp:g.fp,mp:g.mp});
    setEditId(g.id);setPrev(null);setOcrs("idle");
    window.scrollTo({top:0,behavior:"smooth"});
  };

  const crearComision=()=>{
    if(!newCom.cli||!newCom.cc)return;
    onAddC({...newCom,ing:f.ing});
    setNewCom({cli:"",cc:""});setShowNuevaCom(false);
  };

  const gastosIng=gastos.filter(g=>g.ing===f.ing);
  const total=gastosIng.reduce((s,g)=>s+num(g.tc),0);
  const comLabel=(id)=>{const c=comisiones.find(x=>x.id===id);return c?c.cli+" - CC "+c.cc:""};

  return h("div",{style:S.col},

    // Selector ingeniero
    h(Card,{title:"Ingeniero"},
      h("div",{style:S.g2},
        h(F,{label:"Selecciona tu nombre"},
          h("select",{style:S.inp,value:f.ing,onChange:e=>setF(p=>({...p,ing:e.target.value,comId:""}))},
            INGENIEROS.map(i=>h("option",{key:i},i)))))),

    // Gestion de comisiones activas
    h(Card,{title:"Proyectos / Comisiones Activas"},
      misComisiones.length===0
        ?h("div",{style:{color:"#9CA3AF",fontSize:13,marginBottom:12}},"No tienes proyectos activos. Crea uno para empezar a registrar gastos.")
        :h("div",{style:{display:"flex",flexDirection:"column",gap:8,marginBottom:12}},
          misComisiones.map(c=>h("div",{key:c.id,style:S.comCard},
            h("div",null,
              h("div",{style:{fontWeight:700,fontSize:14,color:"#1E293B"}},c.cli),
              h("div",{style:{display:"flex",gap:6,marginTop:4}},
                h("span",{style:S.comTag},"CC "+c.cc),
                h("span",{style:{...S.comTag,background:"#D1FAE5",color:"#065F46"}},
                  gastos.filter(g=>g.comId===c.id).length+" gastos"))),
            h("button",{style:S.btnSmRed,onClick:()=>onDelC(c.id)},"Cerrar")))),
      h("button",{style:{...S.btnSm,width:"100%"},onClick:()=>setShowNuevaCom(true)},"+ Nuevo Proyecto")),

    // Modal nueva comision
    showNuevaCom&&h("div",{style:S.modalBg},
      h("div",{style:S.modal},
        h("div",{style:S.modalTitle},"Nuevo Proyecto / Comision"),
        h("div",{style:{display:"flex",flexDirection:"column",gap:12,marginBottom:16}},
          h("div",null,
            h("label",{style:S.lbl},"Cliente"),
            h("input",{style:S.inp,value:newCom.cli,onChange:e=>setNewCom(p=>({...p,cli:e.target.value})),placeholder:"Nombre del cliente"})),
          h("div",null,
            h("label",{style:S.lbl},"Centro de Costos"),
            h("input",{style:S.inp,value:newCom.cc,onChange:e=>setNewCom(p=>({...p,cc:e.target.value})),placeholder:"Ej: 3-26"}))),
        h("div",{style:{display:"flex",gap:10}},
          h("button",{style:{...S.btnOrange,marginTop:0,flex:1},onClick:crearComision},"Crear"),
          h("button",{style:{...S.btnOrange,marginTop:0,flex:1,background:"#F1F5F9",color:"#374151"},onClick:()=>setShowNuevaCom(false)},"Cancelar")))),

    // Foto
    h(Card,{title:"Foto del Recibo"},
      h("div",{style:S.fotoZone,onClick:()=>ref.current.click()},
        prev?h("img",{src:prev,alt:"recibo",style:S.previewImg})
          :h("div",{style:S.fotoPH},
              h("span",{style:{fontSize:40}},""),
              h("span",{style:{color:"#6B7280",fontSize:14}},"Toca para tomar o subir foto")),
        ocrs==="loading"&&h("div",{style:S.ocrOv},h("div",{style:S.ocrSpin}),h("span",{style:{color:"#fff",fontWeight:600}},"Leyendo recibo con IA...")),
        ocrs==="done"&&h("div",{style:S.ocrBadge},"Datos extraidos automaticamente"),
        ocrs==="error"&&h("div",{style:{...S.ocrBadge,background:"#7F1D1D",maxWidth:"90%",textAlign:"center"}},errMsg?""+errMsg:"No se pudo leer")),
      h("input",{ref,type:"file",accept:"image/*",style:{display:"none"},onChange:handleFoto})),

    // Datos del gasto
    h(Card,{title:"Datos del Gasto"},
      h("div",{style:S.g2},
        h(F,{label:"Proyecto",wide:true},
          misComisiones.length===0
            ?h("div",{style:{...S.inp,background:"#FEF3C7",color:"#92400E",fontSize:13}},"Primero crea un proyecto activo")
            :h("select",{style:{...S.inp,borderColor:!f.comId?"#F59E0B":"#E2E8F0"},value:f.comId,onChange:e=>set("comId",parseInt(e.target.value))},
                h("option",{value:""},"\u2014 Selecciona el proyecto \u2014"),
                misComisiones.map(c=>h("option",{key:c.id,value:c.id},c.cli+" - CC "+c.cc)))),
        h(F,{label:"Fecha de Pago"},
          h("input",{style:S.inp,type:"date",value:f.fp,onChange:e=>set("fp",e.target.value)})),
        h(F,{label:"M\u00E9todo de Pago"},
          h("select",{style:S.inp,value:f.mp,onChange:e=>set("mp",e.target.value)},
            h("option",{value:"EFECTIVO"},"Efectivo / Contado"),
            h("option",{value:"TARJETA"},"Tarjeta Corporativa"))),
        h(F,{label:"Pagado a (Establecimiento)",wide:true},
          h("input",{style:S.inp,value:f.est,onChange:e=>set("est",e.target.value),placeholder:"Nombre del establecimiento"})),
        h(F,{label:"NIT / C\u00E9dula"},
          h("input",{style:S.inp,value:f.nit,onChange:e=>set("nit",e.target.value),placeholder:"Ej: 900123456-1"})),
        h(F,{label:"No. Factura"},
          h("input",{style:S.inp,value:f.fac,onChange:e=>set("fac",e.target.value),placeholder:"Ej: FE-001234"})),
        h(F,{label:"Concepto",wide:true},
          h("select",{style:S.inp,value:f.con,onChange:e=>set("con",e.target.value)},
            CONCEPTOS.map(c=>h("option",{key:c},c)))),
        h(F,{label:"Subtotal (sin IVA)"},
          h("input",{style:S.inp,type:"number",value:f.sub,onChange:e=>set("sub",e.target.value),placeholder:"0"})),
        h(F,{label:"IVA"},
          h("input",{style:S.inp,type:"number",value:f.iva,onChange:e=>set("iva",e.target.value),placeholder:"0"}))),
      h("div",{style:S.totalRow},
        h("span",{style:S.totalLbl},"Total del Gasto"),
        h("span",{style:S.totalVal},fmt(tc()))),
      editId&&h("div",{style:{background:"#FEF3C7",border:"1px solid #F59E0B",borderRadius:8,padding:"10px 14px",marginTop:12,fontSize:13,color:"#92400E",display:"flex",justifyContent:"space-between",alignItems:"center"}},
        h("span",null,"Editando gasto"),
        h("button",{style:{background:"none",border:"none",color:"#92400E",cursor:"pointer",fontWeight:700},onClick:()=>{setEditId(null);setF(EG);setPrev(null);setOcrs("idle");}},"Cancelar")),
      h("button",{style:ok?S.btnGreen:editId?{...S.btnOrange,background:"#7C3AED"}:S.btnOrange,onClick:guardar},
        ok?"Guardado":editId?"Guardar Cambios":"Guardar Gasto")),

    // Tabla de gastos por ingeniero
    gastosIng.length>0&&h(Card,{title:"Gastos Registrados - "+f.ing},
      h(Tabla,{gastos:gastosIng,comisiones,onEdit:cargarEdicion}),
      h("div",{style:S.resumen},"Total: ",h("strong",null,fmt(total))," \u00B7 ",gastosIng.length," gastos"),
      h("button",{style:S.btnBlue,onClick:()=>exportarExcel(gastosIng,misComisiones,f.ing)},"Exportar Excel FO-AF-002")));
}

//  Vista Contabilidad 
function VistaCon({gastos,comisiones,onDelG,onEditG}){
  const [fi,setFi]=useState("TODOS");
  const [fc,setFc]=useState("TODOS");
  const [fcom,setFcom]=useState("TODOS");
  const [fd,setFd]=useState("");
  const [fh,setFh]=useState("");
  const [ant,setAnt]=useState("");
  const [modal,setModal]=useState(false);

  const filt=gastos.filter(g=>{
    if(fi!=="TODOS"&&g.ing!==fi)return false;
    if(fc!=="TODOS"&&g.con!==fc)return false;
    if(fcom!=="TODOS"&&String(g.comId)!==fcom)return false;
    if(fd&&g.fp<fd)return false;
    if(fh&&g.fp>fh)return false;
    return true;
  });

  const totF=filt.reduce((s,g)=>s+num(g.tc),0);
  const totEf=filt.filter(g=>g.mp==="EFECTIVO").reduce((s,g)=>s+num(g.tc),0);
  const totTj=filt.filter(g=>g.mp==="TARJETA").reduce((s,g)=>s+num(g.tc),0);
  const totIVA=filt.reduce((s,g)=>s+num(g.iva),0);
  const antic=num(ant);
  const remb=antic>totF?antic-totF:0;
  const salf=totF>antic?totF-antic:0;
  const porIng=INGENIEROS.map(ing=>({n:ing,t:gastos.filter(g=>g.ing===ing).reduce((s,g)=>s+num(g.tc),0),c:gastos.filter(g=>g.ing===ing).length})).filter(i=>i.c>0);
  const comLabel=(id)=>{const c=comisiones.find(x=>x.id===id);return c?(c.cli+" CC"+c.cc):""};

  return h("div",{style:S.col},
    h("div",{style:S.kpiRow},
      h(Kpi,{label:"Total Gastos",value:fmt(totF),icon:"",color:"#0F4C81"}),
      h(Kpi,{label:"Efectivo / Contado",value:fmt(totEf),icon:"",color:"#047857"}),
      h(Kpi,{label:"Tarjeta Corporativa",value:fmt(totTj),icon:"",color:"#7C3AED"}),
      h(Kpi,{label:"Total IVA",value:fmt(totIVA),icon:"",color:"#B45309"})),

    h(Card,{title:"Control de Anticipo"},
      h("div",{style:S.g2},
        h(F,{label:"Valor del Anticipo Girado (COP)"},
          h("input",{style:S.inp,type:"number",value:ant,onChange:e=>setAnt(e.target.value),placeholder:"Ingrese el valor del anticipo"})),
        h(F,{label:"Total Gastado"},h("div",{style:{...S.inp,background:"#F1F5F9",fontWeight:700,color:"#0F4C81"}},fmt(totF))),
        h(F,{label:"Reembolso (Sobr\u00F3)"},h("div",{style:{...S.inp,background:remb>0?"#D1FAE5":"#F1F5F9",fontWeight:700,color:remb>0?"#065F46":"#6B7280"}},fmt(remb))),
        h(F,{label:"Saldo a Favor ESPINCONTROL"},h("div",{style:{...S.inp,background:salf>0?"#FEE2E2":"#F1F5F9",fontWeight:700,color:salf>0?"#DC2626":"#6B7280"}},fmt(salf))))),

    porIng.length>0&&h("div",{style:S.kpiRow},
      porIng.map(i=>h("div",{key:i.n,style:S.ingCard},
        h("div",{style:{fontWeight:800,color:"#0F4C81",fontSize:14}},i.n),
        h("div",{style:{fontWeight:900,fontSize:17,color:"#1E293B",marginTop:4}},fmt(i.t)),
        h("div",{style:{fontSize:12,color:"#9CA3AF",marginTop:2}},i.c+" gastos")))),

    h(Card,{title:"Registro de Gastos"},
      h("div",{style:{display:"flex",gap:8,flexWrap:"wrap",marginBottom:12,alignItems:"flex-end"}},
        h("div",null,h("div",{style:S.filtLbl},"Ingeniero"),
          h("select",{style:S.inpSm,value:fi,onChange:e=>setFi(e.target.value)},
            h("option",{value:"TODOS"},"Todos"),INGENIEROS.map(i=>h("option",{key:i},i)))),
        h("div",null,h("div",{style:S.filtLbl},"Proyecto"),
          h("select",{style:S.inpSm,value:fcom,onChange:e=>setFcom(e.target.value)},
            h("option",{value:"TODOS"},"Todos"),
            comisiones.map(c=>h("option",{key:c.id,value:String(c.id)},c.cli+" CC"+c.cc)))),
        h("div",null,h("div",{style:S.filtLbl},"Concepto"),
          h("select",{style:S.inpSm,value:fc,onChange:e=>setFc(e.target.value)},
            h("option",{value:"TODOS"},"Todos"),CONCEPTOS.map(c=>h("option",{key:c},c)))),
        h("div",null,h("div",{style:S.filtLbl},"Desde"),
          h("input",{style:S.inpSm,type:"date",value:fd,onChange:e=>setFd(e.target.value)})),
        h("div",null,h("div",{style:S.filtLbl},"Hasta"),
          h("input",{style:S.inpSm,type:"date",value:fh,onChange:e=>setFh(e.target.value)})),
        (fd||fh)&&h("button",{style:{...S.btnSmGray,alignSelf:"flex-end"},onClick:()=>{setFd("");setFh("");}}," Limpiar"),
        h("button",{style:{...S.btnSm,marginLeft:"auto",alignSelf:"flex-end"},onClick:()=>setModal(true)}," Exportar Excel")),
      (fd||fh)&&h("div",{style:S.filtBadge}," ",fd||"Inicio"," \u2192 ",fh||"Hoy"," \u00B7 ",h("strong",null,filt.length)," gastos"),
      filt.length===0?h("div",{style:S.empty},"No hay gastos registrados a\u00FAn.")
        :h(Tabla,{gastos:filt,comisiones,onDel:onDelG,showIng:true}),
      h("div",{style:S.resumen},filt.length," gastos \u00B7 Total: ",h("strong",null,fmt(totF))," \u00B7 Efectivo: ",h("strong",null,fmt(totEf))," \u00B7 Tarjeta: ",h("strong",null,fmt(totTj)))),

    modal&&h("div",{style:S.modalBg},
      h("div",{style:S.modal},
        h("div",{style:S.modalTitle},"Exportar Excel FO-AF-002"),
        h("p",{style:{color:"#6B7280",fontSize:13,margin:"0 0 16px"}},
          "Se exportar\u00E1n ",h("strong",null,filt.length)," gastos. El archivo tendr\u00E1 una hoja por proyecto/comisi\u00F3n.",
          ant?" Anticipo: "+fmt(ant)+".":""),
        h("div",{style:{display:"flex",gap:10}},
          h("button",{style:{...S.btnOrange,marginTop:0,flex:1},
            onClick:()=>{
              const ings=[...new Set(filt.map(g=>g.ing))];
              ings.forEach(ing=>{
                const gc=filt.filter(g=>g.ing===ing);
                const cc=comisiones.filter(c=>c.ing===ing&&gc.some(g=>g.comId===c.id));
                exportarExcel(gc,cc,ing);
              });
              setModal(false);
            }}," Confirmar y Descargar"),
          h("button",{style:{...S.btnOrange,marginTop:0,flex:1,background:"#F1F5F9",color:"#374151"},onClick:()=>setModal(false)},"Cancelar")))));
}

//  Tabla 
function Tabla({gastos,comisiones,onDel,onEdit,showIng}){
  const comLabel=(id)=>{const c=comisiones.find(x=>x.id===id||x.id===Number(id));return c?(c.cli+" CC"+c.cc):""};
  return h("div",{style:{overflowX:"auto"}},
    h("table",{style:S.table},
      h("thead",null,h("tr",null,
        showIng&&h("th",{style:S.th},"Ingeniero"),
        h("th",{style:S.th},"Proyecto"),
        h("th",{style:S.th},"Fecha"),h("th",{style:S.th},"Establecimiento"),
        h("th",{style:S.th},"NIT"),h("th",{style:S.th},"Concepto"),
        h("th",{style:S.thR},"Subtotal"),h("th",{style:S.thR},"IVA"),h("th",{style:S.thR},"Total"),
        h("th",{style:S.th},"Pago"),h("th",{style:S.th},""))),
      h("tbody",null,gastos.map(g=>
        h("tr",{key:g.id,style:S.tr},
          showIng&&h("td",{style:S.td},h("strong",null,g.ing?.split(" ")[0])),
          h("td",{style:S.td},h("span",{style:S.badgeGreen},comLabel(g.comId)||"\u2014")),
          h("td",{style:S.td},g.fp),
          h("td",{style:S.td},g.est),
          h("td",{style:S.td},g.nit),
          h("td",{style:S.td},h("span",{style:S.badge},g.con)),
          h("td",{style:S.tdR},fmt(g.sub)),
          h("td",{style:S.tdR},fmt(g.iva)),
          h("td",{style:{...S.tdR,fontWeight:700,color:"#0F4C81"}},fmt(g.tc)),
          h("td",{style:S.td},h("span",{style:g.mp==="TARJETA"?S.tagTj:S.tagEf},g.mp)),
          h("td",{style:S.td},h("div",{style:{display:"flex",gap:4}},
            onEdit&&h("button",{style:{...S.btnDel,background:"#EFF6FF",color:"#1D4ED8"},onClick:()=>onEdit(g)},""),
            onDel&&h("button",{style:S.btnDel,onClick:()=>onDel(g.id)},"")))))));
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App,null));
</script>
